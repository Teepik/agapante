name: Bourse · collecte hebdomadaire
on:
  push:
    branches: [main, bourse]
    paths: ["outils/bourse/**", ".github/workflows/bourse-collecte.yml"]
  schedule:
    - cron: "17 3 * * 6"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bourse-collecte-${{ github.ref }}
  cancel-in-progress: true
jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: pip install --quiet -r outils/bourse/requirements.txt
      - name: Collecte
        run: python outils/bourse/collecte.py
      - name: Traitement
        run: python outils/bourse/traitement.py
      - name: Enregistrement dans la base
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python outils/bourse/enregistrer.py
      - name: Copie chiffrée pour vérification (branche d'essai)
        if: always() && github.ref != 'refs/heads/main'
        run: |
          cd outils/bourse
          tar czf /tmp/essai.tgz _brut _sortie 2>/dev/null || tar czf /tmp/essai.tgz _brut
          openssl rand -hex 32 > /tmp/cle.txt
          openssl enc -aes-256-cbc -pbkdf2 -salt -in /tmp/essai.tgz -out /tmp/essai.tgz.enc -pass file:/tmp/cle.txt
          openssl pkeyutl -encrypt -pubin -inkey cle_essai_publique.pem -in /tmp/cle.txt -out /tmp/cle.enc
          cd "$GITHUB_WORKSPACE"
          git config user.name "collecte-bourse"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan bourse-essai-tmp
          git rm -rf --cached . > /dev/null
          mkdir -p essai && cp /tmp/essai.tgz.enc /tmp/cle.enc essai/
          echo '{"git":{"deploymentEnabled":false}}' > vercel.json
          git add essai vercel.json
          git commit -m "Essai de collecte chiffré (${{ github.run_id }})"
          git push -f origin HEAD:bourse-essai
